<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TINITIATE forms</title>
</head>
<body>
  <form name="request-callback" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="request-callback" />
    <input type="hidden" name="subject" value="New TINITIATE callback request" data-remove-prefix />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="datetime-local" name="preferredTime" />
    <select name="service"><option>Other</option></select>
    <textarea name="message"></textarea>
  </form>
</body>
</html>
